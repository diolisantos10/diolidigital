name: Sentinela do deploy — o que está no ar passou pelo portão?

# ── POR QUE ESTE WORKFLOW EXISTE ────────────────────────────────────────────
# 06/08/2026. A produção passou a servir o commit `7724050` sem que a CI
# tivesse rodado UMA VEZ nesse commit (pane do GitHub Actions: webhooks
# estrangulados a ~15%, incidente aberto 15:22Z). O Railway faz deploy por
# PUSH, não por CI verde — então subiu. E a agência trabalhou a tarde inteira
# achando que estava tudo conferido.
#
# Ninguém foi avisado porque "a CI não rodou" e "a CI passou" produzem o mesmo
# efeito na caixa de entrada: nenhum e-mail vermelho. Silêncio virou aprovação.
#
# Este workflow existe para que o SILÊNCIO NÃO SEJA MAIS UMA RESPOSTA VÁLIDA.
# Ele pergunta ativamente à produção qual commit está no ar, confere se aquele
# commit tem CI verde, e — quando não tem — ABRE UMA ISSUE. Issue notifica o
# dono do repositório por e-mail sem depender de ninguém ir olhar a aba Actions.
#
# Por que issue e não só um job vermelho: um job vermelho é mais um e-mail
# "workflow failed" no meio dos outros. A issue tem título em português, corpo
# com a ação, e fica ABERTA até alguém fechar — ela cobra.

on:
# ⏸ PARADA GERAL — ordem do CEO, 15/08/2026: "quero tudo parado para ser
#   redesenhado" / "nenhuma atividade funcionando". O gatilho `schedule`
#   abaixo está COMENTADO, não apagado: o redesenho vai decidir se ele volta
#   como estava, com outro horário, ou não volta. `workflow_dispatch` fica —
#   disparo à mão continua possível e é sempre um gesto humano deliberado.
#   Para religar: descomente o bloco. Nada mais precisa ser mexido.
#  schedule:
#    # De hora em hora. Vale lembrar (medido neste repositório) que `schedule` é
#    # best-effort e o intervalo real fica bem acima do escrito — ver o
#    # comentário em cron-execute.yml. Por isso o sentinela também roda a cada
#    # push: assim todo deploy é conferido logo depois de acontecer.
#    - cron: "17 * * * *"
  workflow_dispatch: {}

# ── O GATILHO DE PUSH FOI REMOVIDO EM 06/08/2026, E ISSO FOI DE PROPÓSITO ────
# O portão do deploy passou a ser o "Wait for CI" do Railway: ele espera os
# workflows daquele push e DESCARTA a implantação se algum deles não fechar
# verde. Um sentinela rodando no push entraria nessa conta — e o sentinela
# fecha vermelho justamente quando a produção está ruim.
#
# O resultado seria o pior impasse possível: produção em estado ruim →
# sentinela vermelho → Railway descarta o deploy → o conserto não sobe →
# sentinela continua vermelho. O alarme de incêndio trancando a porta.
#
# Quem GUARDA a produção agora é a CI, na frente do deploy. O sentinela voltou
# a ser o que ele é: quem CONFERE depois e abre issue. Custo declarado: a
# conferência de um deploy deixa de ser imediata e passa a esperar a rodada
# de hora em hora (que, medido neste repositório, na prática demora mais que
# uma hora). Quem quiser na hora: `workflow_dispatch`, ou `npm run sentinela`.

# Não adianta ter três sentinelas conferindo a mesma produção ao mesmo tempo.
concurrency:
  group: sentinela-do-deploy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # (A espera de 3 min existia para o gatilho de push, que saiu daqui.
      #  Na rodada agendada e no disparo manual não há deploy em curso para
      #  esperar — e esperar à toa só queima runner.)

      # ── POR QUE ESTE PASSO NÃO PODE DERRUBAR O JOB ────────────────────────
      # Desde 06/08/2026 o portão do deploy é o "Wait for CI" do Railway: ele
      # segura a subida enquanto os workflows do push rodam e a DESCARTA se
      # algum deles falhar. O sentinela roda no mesmo push — e falha de
      # propósito quando a produção está sem prova.
      #
      # Somando as duas coisas sem cuidado, nasce um impasse: produção em
      # estado ruim → sentinela vermelho → Railway descarta o deploy → o
      # conserto não sobe → sentinela continua vermelho. O alarme viraria a
      # tranca da porta de saída.
      #
      # Quem GUARDA é a CI; quem DENUNCIA é o sentinela, e a denúncia dele é a
      # issue (que notifica por e-mail e fica aberta cobrando), não a cor do
      # job. Por isso o passo é `continue-on-error` e a issue passou a depender
      # do CÓDIGO do veredito, não da falha do passo.
      - name: Perguntar à produção e ao portão
        id: sentinela
        continue-on-error: true
        run: npm run sentinela
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Qualquer veredito que não seja APROVADO abre issue. Output vazio
      # também: sentinela mudo é sentinela quebrado, não "está tudo bem".
      - name: Abrir issue quando a produção está sem prova
        if: steps.sentinela.outputs.codigo != '' && steps.sentinela.outputs.codigo != 'APROVADO'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODIGO: ${{ steps.sentinela.outputs.codigo }}
          GRAVIDADE: ${{ steps.sentinela.outputs.gravidade }}
          RESUMO: ${{ steps.sentinela.outputs.resumo }}
          ACAO: ${{ steps.sentinela.outputs.acao }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITULO="🚨 Produção sem prova: $CODIGO"
          # Uma issue aberta por vez para o mesmo código. Sentinela que abre uma
          # issue por hora vira spam, e spam é a mesma doença que ele veio curar.
          EXISTE=$(gh issue list --state open --label sentinela-do-deploy \
                     --search "$CODIGO in:title" --json number --jq '.[0].number // empty')
          CORPO=$(printf '%s\n\n**O que fazer:** %s\n\n---\nVerificado automaticamente em %s\nRodada: %s\n' \
                    "$RESUMO" "$ACAO" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$RUN_URL")
          if [ -n "$EXISTE" ]; then
            echo "Issue #$EXISTE já está aberta para $CODIGO — comentando em vez de abrir outra."
            gh issue comment "$EXISTE" --body "$CORPO"
          else
            gh issue create --title "$TITULO" --body "$CORPO" \
              --label sentinela-do-deploy 2>/dev/null \
              || gh issue create --title "$TITULO" --body "$CORPO"
          fi

      # Sentinela que não deu veredito nenhum é sentinela QUEBRADO — e um
      # sentinela quebrado tem exatamente a mesma aparência de um sentinela
      # satisfeito: silêncio. É a doença que este workflow inteiro veio curar,
      # aplicada a ele mesmo.
      - name: Gritar quando o próprio sentinela ficou mudo
        if: steps.sentinela.outputs.codigo == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITULO="🚨 O sentinela do deploy não deu veredito"
          EXISTE=$(gh issue list --state open --search "não deu veredito in:title" \
                     --json number --jq '.[0].number // empty')
          CORPO="O sentinela rodou e não produziu código de veredito. Enquanto isso, ninguém está conferindo se o que está no ar passou pelo portão. Rodada: $RUN_URL"
          if [ -n "$EXISTE" ]; then
            gh issue comment "$EXISTE" --body "$CORPO"
          else
            gh issue create --title "$TITULO" --body "$CORPO"
          fi
