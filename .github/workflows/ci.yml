name: CI

# Portão de qualidade: typecheck + testes rodam em todo push/PR. É o que faz a
# blindagem do cérebro (gateway-safety) e a Lei 1/Lei 2 valerem de verdade —
# sem CI, nenhum guard protege. Lint entra como informativo por ora (há dívida
# pré-existente a limpar) e vira bloqueante quando estiver zerado.

on:
  push:
    # A BRANCH DE PRODUÇÃO VEM NOMEADA, e não é redundância com o `**`.
    # O Railway só reconhece um workflow como portão ("Wait for CI") quando
    # acha um `on: push: branches:` que ele consiga casar com a branch
    # conectada — glob não basta. Sem esta linha, o portão do deploy ficaria
    # ligado sem ter o que esperar, que é aprovar tudo com cara de trava.
    # Conferir com `npm run portao`: "workflows de portão" tem que ser >= 1.
    branches:
      - claude/dioli-agency-os-architecture-kk7kp
      - "**"
  pull_request:
    branches: ["**"]

# ── POR QUE ESTE BLOCO EXISTE ───────────────────────────────────────────────
# Em 06/08/2026 a caixa do CEO recebeu SEIS e-mails de CI numa hora, quase
# todos "All jobs were cancelled". Vários agentes empurram na mesma branch com
# minutos de diferença, e cada push abria um run novo enquanto o anterior ainda
# rodava — cinco rodadas de ~8 min cada para provar o mesmo código, disputando
# runner com o cron que socorre a produção.
#
# Sem `concurrency`, quem matava esses runs era a infraestrutura, e run morto
# por infraestrutura fecha como `failure` — e-mail vermelho para um cancelamento
# que não era defeito nenhum. Ruído vermelho é pior que silêncio: ele treina
# quem lê a caixa a ignorar a cor vermelha, e aí o alarme de verdade passa
# batido.
#
# Com o bloco, o cancelamento é DELIBERADO: o run superado fecha como
# `cancelled` (que o GitHub não manda por e-mail) e o runner sobra para o
# commit que interessa.
#
# Em 06/08/2026 isso bastava porque o grupo era por BRANCH — só o commit mais
# novo daquela branch sobrevivia. Mas em 16/08/2026 essa mesma regra CONGELOU
# a entrega: a produção ficou travada em c52aff2 (18:32:07Z) com 21 commits
# represados atrás dela. As sessões empurravam a cada ~1,3 min e o portão leva
# ~8 min para terminar — agrupado por branch, todo run era cancelado pelo push
# seguinte antes de fechar. Nenhum commit novo ficava verde, e o "Wait for CI"
# do Railway — funcionando exatamente como projetado — não tinha run verde
# nenhum para promover. Produção serviu código 21 commits atrás, incluindo
# consertos de segurança já fechados. Numa urgência real, um conserto não
# conseguiria subir.
#
# Por isso o grupo agora é por COMMIT (`github.sha`), não por branch. Um
# re-push do MESMO commit continua cancelando o run anterior — o ruído
# vermelho de run supersedido do incidente de 06/08 continua apagado. O que
# muda é que um commit NOVO nunca cancela o run de um commit DIFERENTE: cada
# commit recebe o seu próprio veredito, e o Railway sempre tem um verde
# recente para promover. O preço, aceito conscientemente: mais runs
# simultâneos (~6 na cadência atual de pushes). É mais barato que entrega
# congelada.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # O portão inteiro leva ~8 min. Em 06/08 um job ficou 45 min pendurado sem
    # registrar UM passo sequer e sem deixar log — segurando runner e virando
    # e-mail de falha no fim. Teto explícito: passou de 30, o problema não é o
    # nosso código, é a rodada, e ela morre rápido em vez de apodrecer devagar.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # O molde de marca prova NO PIXEL que o texto pedido saiu escrito na arte,
      # e essa prova precisa de um navegador de verdade. Sem Chromium, o teste
      # sentinela REPROVA a rodada de propósito (`__tests__/design/molde-render`)
      # — verde sem prova é pior que vermelho. A saída certa é instalar o
      # navegador aqui, não declarar a lacuna: declarar deixaria o CI verde para
      # sempre com a prova nunca rodando, que é exatamente o buraco que o
      # sentinela existe para fechar.
      - name: Chromium para a prova do pixel
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      # O BUILD DE PRODUÇÃO ENTRA NO PORTÃO.
      # Em 05/08/2026 um `import.meta.url` num arquivo novo passou por typecheck
      # e por 1715 testes, e derrubou TODOS os deploys por uma hora: o Railway
      # falhava no build e mantinha a versão antiga no ar, sem barulho nenhum.
      # CI que não roda o build não protege o deploy — protege o editor.
      #
      # ── E ELE PASSOU A RODAR ANTES DOS TESTES (30/08/2026) ────────────────
      #
      # Enquanto o build vinha DEPOIS, todo teste que mede o ARTEFATO DE
      # PRODUÇÃO era pulado aqui dentro — não havia `.next/standalone` na hora
      # em que o `npm test` rodava. Eram exatamente as provas que respondem
      # "isto chega ao contêiner?":
      #
      #   • `__tests__/connect/a-ficha-chega-em-producao.test.ts` — as 93 fichas
      #     dos agentes, sem as quais o motor recusa TODAS as funções em
      #     produção com "sem ficha não se executa";
      #   • `__tests__/plataforma/o-navegador-chega-em-producao.test.ts` — o
      #     `browsers.json` do playwright, cuja ausência parou a agência por
      #     dias em 08/08/2026.
      #
      # As duas provas mais caras de descobrir em produção eram as duas que este
      # portão nunca rodou, e o relatório dizia "ok" com código de saída zero.
      # Pulado é aprovado para quem lê o verde. Construir antes custa os mesmos
      # minutos e faz as duas medirem de verdade.
      - name: Build de produção (ANTES dos testes — ver o comentário acima)
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Tests (a suíte inteira, com o artefato de produção já construído)
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee vitest-saida.log

      # ⛔ ZERO PULADOS, E A TRAVA É CÓDIGO — NÃO RECOMENDAÇÃO ESCRITA.
      #
      # Teste pulado sai com a palavra do protocolo em "ok" e o código de saída
      # em zero: qualquer leitor lê aprovação. Foi assim que as duas provas de
      # artefato de produção passaram meses sem rodar em CI nenhum, com o
      # relatório verde o tempo todo. Ordem do CEO em 30/08/2026: a rodada
      # termina com ZERO pulados, e um pulado que sobra "não pode existir — ou
      # vira teste de verdade, ou some, ou reprova".
      #
      # FAIL-CLOSED: se a linha de resumo do vitest não for encontrada, isto
      # REPROVA. "Não sei se houve pulado" nunca vira "então passou" — mesma
      # régua de `soLevaAReivindicacao` em `lib/coordenacao/`.
      - name: Nenhum teste pulado (pulado passa por aprovado para quem lê o verde)
        run: |
          RESUMO=$(grep -E "^[[:space:]]*Tests[[:space:]]" vitest-saida.log | tail -1)
          echo "Resumo do vitest: ${RESUMO}"
          if [ -z "${RESUMO}" ]; then
            echo "::error::não achei a linha de resumo do vitest; não sei se houve teste pulado, e 'não sei' não vira 'então passou'."
            exit 1
          fi
          if echo "${RESUMO}" | grep -qE "skipped|todo"; then
            echo "::error::a suíte terminou com teste(s) PULADO(S). Ou vira teste de verdade, ou some, ou reprova."
            exit 1
          fi

      - name: Lint (informativo — não bloqueia ainda)
        run: npm run lint
        continue-on-error: true
