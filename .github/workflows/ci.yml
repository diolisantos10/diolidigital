name: CI

# Portão de qualidade: typecheck + testes rodam em todo push/PR. É o que faz a
# blindagem do cérebro (gateway-safety) e a Lei 1/Lei 2 valerem de verdade —
# sem CI, nenhum guard protege. Lint entra como informativo por ora (há dívida
# pré-existente a limpar) e vira bloqueante quando estiver zerado.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # O molde de marca prova NO PIXEL que o texto pedido saiu escrito na arte,
      # e essa prova precisa de um navegador de verdade. Sem Chromium, o teste
      # sentinela REPROVA a rodada de propósito (`__tests__/design/molde-render`)
      # — verde sem prova é pior que vermelho. A saída certa é instalar o
      # navegador aqui, não declarar a lacuna: declarar deixaria o CI verde para
      # sempre com a prova nunca rodando, que é exatamente o buraco que o
      # sentinela existe para fechar.
      - name: Chromium para a prova do pixel
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Lint (informativo — não bloqueia ainda)
        run: npm run lint
        continue-on-error: true
