name: CI

# Portão de qualidade: typecheck + testes rodam em todo push/PR. É o que faz a
# blindagem do cérebro (gateway-safety) e a Lei 1/Lei 2 valerem de verdade —
# sem CI, nenhum guard protege. Lint entra como informativo por ora (há dívida
# pré-existente a limpar) e vira bloqueante quando estiver zerado.

on:
  push:
    # A BRANCH DE PRODUÇÃO VEM NOMEADA, e não é redundância com o `**`.
    # O Railway só reconhece um workflow como portão ("Wait for CI") quando
    # acha um `on: push: branches:` que ele consiga casar com a branch
    # conectada — glob não basta. Sem esta linha, o portão do deploy ficaria
    # ligado sem ter o que esperar, que é aprovar tudo com cara de trava.
    # Conferir com `npm run portao`: "workflows de portão" tem que ser >= 1.
    branches:
      - claude/dioli-agency-os-architecture-kk7kp
      - "**"
  pull_request:
    branches: ["**"]

# ── POR QUE ESTE BLOCO EXISTE ───────────────────────────────────────────────
# Em 06/08/2026 a caixa do CEO recebeu SEIS e-mails de CI numa hora, quase
# todos "All jobs were cancelled". Vários agentes empurram na mesma branch com
# minutos de diferença, e cada push abria um run novo enquanto o anterior ainda
# rodava — cinco rodadas de ~8 min cada para provar o mesmo código, disputando
# runner com o cron que socorre a produção.
#
# Sem `concurrency`, quem matava esses runs era a infraestrutura, e run morto
# por infraestrutura fecha como `failure` — e-mail vermelho para um cancelamento
# que não era defeito nenhum. Ruído vermelho é pior que silêncio: ele treina
# quem lê a caixa a ignorar a cor vermelha, e aí o alarme de verdade passa
# batido.
#
# Com o bloco, o cancelamento é DELIBERADO: o run superado fecha como
# `cancelled` (que o GitHub não manda por e-mail) e o runner sobra para o
# commit que interessa. O run do commit mais novo — o único que pode ir para
# produção — nunca é cancelado, porque só o mais novo sobrevive ao grupo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # O portão inteiro leva ~8 min. Em 06/08 um job ficou 45 min pendurado sem
    # registrar UM passo sequer e sem deixar log — segurando runner e virando
    # e-mail de falha no fim. Teto explícito: passou de 30, o problema não é o
    # nosso código, é a rodada, e ela morre rápido em vez de apodrecer devagar.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # O molde de marca prova NO PIXEL que o texto pedido saiu escrito na arte,
      # e essa prova precisa de um navegador de verdade. Sem Chromium, o teste
      # sentinela REPROVA a rodada de propósito (`__tests__/design/molde-render`)
      # — verde sem prova é pior que vermelho. A saída certa é instalar o
      # navegador aqui, não declarar a lacuna: declarar deixaria o CI verde para
      # sempre com a prova nunca rodando, que é exatamente o buraco que o
      # sentinela existe para fechar.
      - name: Chromium para a prova do pixel
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # O BUILD DE PRODUÇÃO ENTRA NO PORTÃO.
      # Em 05/08/2026 um `import.meta.url` num arquivo novo passou por typecheck
      # e por 1715 testes, e derrubou TODOS os deploys por uma hora: o Railway
      # falhava no build e mantinha a versão antiga no ar, sem barulho nenhum.
      # CI que não roda o build não protege o deploy — protege o editor.
      - name: Build de produção
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Lint (informativo — não bloqueia ainda)
        run: npm run lint
        continue-on-error: true
