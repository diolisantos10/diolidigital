# ─────────────────────────────────────────────────────────────────────────────
# CLIENTE FALSO — A RODADA AO VIVO, COM O SDR DE IA DE VERDADE NO MEIO
#
# ── POR QUE ESTE WORKFLOW EXISTE ────────────────────────────────────────────
#
# `npm run cliente-falso` roda em qualquer máquina e custa R$ 0,00 — mas só
# exercita o motor de regras. A décima verificação da bateria (o guarda do SDR:
# "nenhuma resposta pode ser barrada, plano B atendendo em silêncio é falha")
# NÃO É MEDIDA nessas rodadas, e o placar diz isso com todas as letras.
#
# Medir a décima exige `--ao-vivo`, e `--ao-vivo` exige `ANTHROPIC_API_KEY`
# (medido em 23/08/2026: o banco descartável da bateria nasce SEM workspace
# nenhum, então `chaveDeRotaPublica` cai direto em `chaveDoAmbiente` — não há
# cofre no banco a consultar, só a variável de ambiente).
#
# A chave não pode circular por conversa, por commit ou por log. Aqui ela vive
# nos segredos do repositório e só existe DENTRO do runner, entregue direto ao
# processo que a gasta. É a mesma forma que a casa irmã (Foocci) já usa em
# `meta-raiox.yml`: o segredo é lido de dentro do runner e nunca impresso.
#
# ⚠️ O LOG DESTE REPOSITÓRIO É PÚBLICO. Nenhum passo aqui imprime a chave: o
# passo de conferência afirma PRESENÇA, nunca valor, e a bateria só imprime a
# conversa do cliente fictício e o placar.
#
# ── POR QUE NÃO ENTRA NO PORTÃO DO DEPLOY ───────────────────────────────────
#
# Só `workflow_dispatch`. Sem gatilho de `push`, o "Wait for CI" do Railway não
# tem o que esperar daqui — mesmo raciocínio do `sentinela-do-deploy.yml`. Uma
# bateria que gasta chave paga e depende de um modelo não-determinístico não
# pode ter poder de barrar a entrega de um conserto urgente.
#
# ── SEGURANÇA DO DADO ───────────────────────────────────────────────────────
#
# A bateria roda contra `.cliente-falso/teste.db`, um SQLite descartável criado
# no próprio runner. Nenhuma variável de produção entra aqui — nem
# `DATABASE_URL`, nem `CRON_SECRET`. E `CLIENTE_FALSO=1` (setado pelo próprio
# script) mantém a trava de saída de pé: nenhum e-mail ou WhatsApp sai.
# ─────────────────────────────────────────────────────────────────────────────

name: Cliente falso — rodada ao vivo (SDR de IA)

on:
  workflow_dispatch:
    inputs:
      rodadas:
        description: "Quantas rodadas seguidas (o SDR é não-determinístico; 3 é o mínimo para afirmar que roda limpo)"
        required: false
        default: "3"

# Uma bateria de cada vez. Duas em paralelo dividiriam o mesmo teto de ritmo da
# rota (`sdr-chat`, 30 chamadas por minuto) e uma barraria a outra — e um 429
# não é defeito da casa, é ruído que o placar teria de carregar.
concurrency:
  group: cliente-falso-ao-vivo
  cancel-in-progress: false

jobs:
  sonda:
    name: Existe token do Railway? (presença, nunca valor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ── SONDA DE PRESENÇA, E NADA MAIS ───────────────────────────────────
      # Roda SÓ nesta branch (`claude/sonda-do-token-railway`), que o Railway
      # não observa — por isso sondar não cria deploy e não atropela o deploy
      # em espera na branch de produção.
      #
      # `CRON_SECRET` entra na lista como CONTROLE: ele existe, e é conhecido
      # que existe. Se ele aparecer "ausente", a sonda está quebrada e nenhum
      # "ausente" desta lista vale nada. Sonda sem controle não prova ausência.
      - name: Presença dos segredos
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KIT_REPO_TOKEN: ${{ secrets.KIT_REPO_TOKEN }}
        run: |
          for nome in CRON_SECRET KIT_REPO_TOKEN RAILWAY_TOKEN RAILWAY_API_TOKEN \
                      RAILWAY_PROJECT_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID \
                      RAILWAY_ENVIRONMENT_ID; do
            if [ -n "$(printenv "$nome" || true)" ]; then
              echo "• ${nome}: PRESENTE"
            else
              echo "• ${nome}: ausente"
            fi
          done
          echo "---"
          echo "CRON_SECRET e KIT_REPO_TOKEN são o CONTROLE: se aparecerem ausentes,"
          echo "a sonda está quebrada e nenhum 'ausente' acima significa nada."
