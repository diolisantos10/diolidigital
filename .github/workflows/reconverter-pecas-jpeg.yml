name: Reconverter peças em PNG para JPEG (à mão)

# ── POR QUE ESTE WORKFLOW EXISTE (14/08/2026) ─────────────────────────────────
#
# A rota `/api/admin/recompor-pecas` exige `Authorization: Bearer CRON_SECRET`.
# Esse segredo mora no Railway e nos secrets deste repositório — e em nenhum
# outro lugar. Sem este workflow, converter as peças de produção exigiria que
# alguém colasse o segredo num terminal, que é exatamente o caminho que esta
# casa proíbe.
#
# ── SEM AGENDA, DE PROPÓSITO ─────────────────────────────────────────────────
#
# `workflow_dispatch` e nada mais. Isto é conserto de um estrago datado — 6
# peças do CityJobs gravadas em PNG pelo rasterizador antigo, medidas em
# produção em 14/08 às 21:43 — e não rotina. Máquina que reescreve arte já
# entregue ao cliente a cada tantas horas, sem ninguém olhando, é o formato do
# incidente de 03/08. Quem roda isto aperta o botão sabendo o que está fazendo.
#
# ── O QUE ELE NÃO FAZ ────────────────────────────────────────────────────────
#
#   • Não publica. A rota não lê `PUBLICACAO_ORGANICA` e não toca a data
#     marcada — há teste que reprova se qualquer um dos dois aparecer.
#   • Não gera imagem paga. A foto de fundo já está no armazenamento; recompor
#     é rasterização local.
#   • Não afrouxa trava. A peça recomposta é medida pela régua da publicação
#     ANTES de ser gravada; se sair PNG de novo, a gravação é recusada.
#
# ── IDEMPOTENTE PELO DADO ────────────────────────────────────────────────────
#
# A seleção do modo `formato-recusado` é feita pelo `mimeType` gravado, não por
# marca em `lastError`. Peça já convertida deixa de ser vista na passada
# seguinte porque o dado dela mudou. Rodar duas vezes não faz mal.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "so-o-arquivo = troca só o contêiner PNG→JPEG (não redesenha, não muda o que o cliente aprovou). carrossel = REDESENHA as telas. formato-recusado = redesenha a peça única."
        required: false
        type: choice
        options: ["so-o-arquivo", "formato-recusado", "carrossel"]
        default: "so-o-arquivo"
      limite:
        description: "Teto de peças nesta passada (vazio = o teto da rota)"
        required: false
        default: ""

jobs:
  reconverter:
    runs-on: ubuntu-latest
    # É um curl, não uma compilação — mas a rasterização de N peças acontece do
    # lado do servidor e leva alguns segundos por peça.
    timeout-minutes: 15
    steps:
      - name: Converter as peças recusadas por formato
        run: |
          # Segredo ausente NÃO passa verde. "Pulei" com exit 0 é um workflow
          # que nunca chamou nada se declarando saudável.
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET não está nos secrets do repositório — nada foi convertido."
            exit 1
          fi

          # POR QUE EXISTEM DOIS MODOS, e por que errar o modo devolve "0 peças"
          # sem devolver erro (medido em 14/08, primeira passada):
          # `formato-recusado` só alcança PEÇA ÚNICA — ele lê `mediaUrl`. Um
          # carrossel guarda as telas em `mediaUrlsJson` e é redesenhado por
          # outra função (`recomporCarrosseis`, modo `carrossel`). As 6 peças do
          # CityJobs são carrosséis de 6 telas, então a primeira passada voltou
          # 0/0/0 — verde, e sem ter consertado nada. O aviso do fim deste
          # arquivo existe exatamente para esse desfecho não passar por sucesso.
          modo="${{ inputs.modo }}"
          modo="${modo:-formato-recusado}"
          url="https://dioli-agency-os-1-production.up.railway.app/api/admin/recompor-pecas?modo=$modo"
          if [ -n "${{ inputs.limite }}" ]; then
            url="$url&limite=${{ inputs.limite }}"
          fi

          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST "$url" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          # ⚠️ NÃO despejar o corpo da resposta no log. Ele traz ids internos de
          # post e de cliente, e o log de CI fica guardado 90 dias e é copiado
          # para issue sem pensar. O que interessa é o status e a CONTAGEM.
          echo "HTTP $code"
          jq -c '{
            quantasRecompostas,
            modo,
            feitas: ((.recompostas // .convertidas // []) | length),
            semFundo: ((.semFundo // .semArquivo // []) | length),
            bloqueadas: ((.bloqueadas // []) | length),
            falhas: ((.falhas // []) | length),
            arquivosNovos,
            caminhos
          }' /tmp/out.json 2>/dev/null \
            || echo "(resposta não-JSON, $(wc -c < /tmp/out.json) bytes — corpo omitido de propósito)"

          # ── O MOTIVO, SEM OS IDS (14/08/2026) ──────────────────────────────
          #
          # A primeira versão deste workflow imprimia só a CONTAGEM de falhas, e
          # a contagem não diz nada: "falhou nas 6" cabe em pelo menos quatro
          # causas diferentes (roteiro ausente, navegador ausente, armazenamento
          # cheio, arquivo sumido) e cada uma leva a um conserto diferente. Uma
          # passada em produção foi gasta sem responder a pergunta.
          #
          # `falhas` é uma lista de `{postId, erro}`. Aqui sai **só o `erro`, e
          # só os distintos**: o motivo é texto de sistema e não carrega id de
          # post nem de cliente, então ele pode viver 90 dias num log de CI —
          # e um motivo repetido 6 vezes vira uma linha, que é como ele deve ser
          # lido de qualquer forma.
          echo "— motivos distintos das falhas (sem ids):"
          jq -r '[.falhas[]?.erro] | unique | .[] | "  · " + .' /tmp/out.json 2>/dev/null \
            || echo "  (nenhum, ou resposta não-JSON)"

          # `semRenderizador` é o campo que separa "a peça tem defeito" de "a
          # casa não tem a ferramenta". Ele NÃO aparecia no jq antigo, e sem ele
          # uma passada sem Chromium é indistinguível de uma passada que não
          # achou nada: as duas voltam 0/0/0, verdes.
          jq -r 'if .semRenderizador then "::error::" + .semRenderizador else empty end' /tmp/out.json 2>/dev/null || true

          # 503 da NOSSA rota quer dizer uma coisa só: CRON_SECRET não existe no
          # servidor. 503 do edge (deploy em curso) não traz essa frase.
          if [ "$code" = "503" ]; then
            if grep -qiE 'não configurad|not configured' /tmp/out.json; then
              echo "::error::A produção respondeu 503: CRON_SECRET não está configurado no servidor."
              exit 1
            fi
            echo "::warning::503 sem ser de configuração (provável deploy em curso). Rode de novo em alguns minutos."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::A rota respondeu HTTP $code — nenhuma peça foi convertida."
            exit 1
          fi

          # Zero recomposta não é sucesso silencioso: ou já estavam todas em
          # JPEG, ou a seleção não achou o que a medição de produção achou. As
          # duas merecem alguém olhando, e a segunda é defeito.
          n=$(jq -r '.quantasRecompostas // 0' /tmp/out.json 2>/dev/null || echo 0)
          if [ "$n" = "0" ]; then
            echo "::warning::Nenhuma peça foi convertida. Se a medição em /api/meta/prontidao ainda acusa PNG, isto é defeito da seleção — não conclua que está tudo certo. Leia os motivos distintos impressos acima."
          fi

          # Peça que FALHOU também não pode passar por verde. Ela não é "0
          # peças, nada a fazer": é trabalho que a casa tentou e não conseguiu,
          # e o motivo está impresso logo acima.
          f=$(jq -r '(.falhas // []) | length' /tmp/out.json 2>/dev/null || echo 0)
          if [ "$f" != "0" ]; then
            echo "::warning::$f peça(s) falharam na conversão — o motivo distinto está impresso acima. Nada foi gravado nessas peças."
          fi
