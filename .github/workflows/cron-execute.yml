name: Cron — recuperar produção travada

# Rede de segurança da produção: a cada 10 min, chama /api/cron/execute pra
# recuperar projetos cuja produção travou (não depende do navegador).
# Requer o secret de repositório CRON_SECRET (mesmo valor setado no Railway).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o worker de execução
        run: |
          # Segredo ausente NÃO passa verde: "pulei" com exit 0 é um workflow que
          # nunca chamou nada se declarando saudável. A rede de segurança da
          # produção estaria desligada e o painel diria que está tudo bem.
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET não está nos secrets do repositório — a recuperação de produção NÃO rodou."
            exit 1
          fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            "https://dioli-agency-os-1-production.up.railway.app/api/cron/execute" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          # ⚠️ NÃO despejar o corpo da resposta no log de CI — ele traz ids
          # internos (projeto, workspace), fica guardado 90 dias e é colado em
          # issue sem pensar. Status e contagem bastam para saber se passou.
          echo "HTTP $code"
          jq -c 'with_entries(select(.value | type == "number" or type == "boolean"))' /tmp/out.json 2>/dev/null \
            || echo "(resposta não-JSON, $(wc -c < /tmp/out.json) bytes — corpo omitido de propósito)"
          # 503 da NOSSA rota quer dizer uma coisa só: CRON_SECRET não existe no
          # servidor — morte silenciosa do cron, não instabilidade. Vermelho.
          # 503 do edge (deploy em curso) não traz essa frase: fica em aviso, que
          # é o status transitório que este job de fato precisa tolerar.
          if [ "$code" = "503" ]; then
            if grep -qiE 'não configurado|not configured' /tmp/out.json; then
              echo "::error::A produção respondeu 503: CRON_SECRET não está configurado no servidor."
              exit 1
            fi
            echo "::warning::503 sem ser de configuração (provável deploy em curso). Não falhei o job."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::A rota respondeu HTTP $code — o worker de execução não rodou."
            exit 1
          fi
