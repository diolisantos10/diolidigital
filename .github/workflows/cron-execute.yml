name: Cron — recuperar produção travada

# Rede de segurança da produção: chama /api/cron/execute pra recuperar projetos
# cuja produção travou (não depende do navegador).
# Requer o secret de repositório CRON_SECRET (mesmo valor setado no Railway).
#
# ⚠️ ESTE "*/10" NÃO É DE 10 EM 10 MINUTOS. Medido em 06/08/2026 sobre os runs
# reais dos três dias anteriores, o intervalo ENTRE DISPAROS foi de 64 a 203
# minutos — mediana perto de 100. `schedule` do GitHub Actions é best-effort:
# em repositório público, na fila compartilhada, a maioria dos tiques é
# simplesmente descartada, e o descarte não gera aviso nenhum.
#
# Ou seja: a rede de segurança da produção roda ~1x por hora e meia, não 6x por
# hora — um fator de ~12 entre o que está escrito e o que acontece. Se algum dia
# a recuperação PRECISAR de granularidade de minutos, ela não pode morar aqui.
#
# O que de fato roda de 5 em 5 minutos é o despertador DENTRO do servidor
# (`instrumentation.ts` → `lib/agency/despertador.ts`). Este cron é o reforço
# de fora para o caso de o próprio servidor estar de pé mas parado — e um
# reforço que dispara a cada hora e meia ainda vale, desde que ninguém acredite
# que ele dispara a cada 10 minutos.

on:
# ⏸ PARADA GERAL — ordem do CEO, 15/08/2026: "quero tudo parado para ser
#   redesenhado" / "nenhuma atividade funcionando". O gatilho `schedule`
#   abaixo está COMENTADO, não apagado: o redesenho vai decidir se ele volta
#   como estava, com outro horário, ou não volta. `workflow_dispatch` fica —
#   disparo à mão continua possível e é sempre um gesto humano deliberado.
#   Para religar: descomente o bloco. Nada mais precisa ser mexido.
#  schedule:
#    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    # É UM curl. Em 06/08 este job ficou 83 MINUTOS pendurado antes de ser
    # morto pela infraestrutura — e o e-mail que chegou ao CEO dizia só
    # "FALHOU", como se a rotina de socorro da produção tivesse encontrado um
    # defeito. Teto de 10 min: a rede de segurança falha rápido e com o motivo
    # certo, em vez de ficar segurando runner e mentindo no assunto do e-mail.
    timeout-minutes: 10
    steps:
      - name: Chamar o worker de execução
        run: |
          # Segredo ausente NÃO passa verde: "pulei" com exit 0 é um workflow que
          # nunca chamou nada se declarando saudável. A rede de segurança da
          # produção estaria desligada e o painel diria que está tudo bem.
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET não está nos secrets do repositório — a recuperação de produção NÃO rodou."
            exit 1
          fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            "https://dioli-agency-os-1-production.up.railway.app/api/cron/execute" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          # ⚠️ NÃO despejar o corpo da resposta no log de CI — ele traz ids
          # internos (projeto, workspace), fica guardado 90 dias e é colado em
          # issue sem pensar. Status e contagem bastam para saber se passou.
          echo "HTTP $code"
          jq -c 'with_entries(select(.value | type == "number" or type == "boolean"))' /tmp/out.json 2>/dev/null \
            || echo "(resposta não-JSON, $(wc -c < /tmp/out.json) bytes — corpo omitido de propósito)"
          # 503 da NOSSA rota quer dizer uma coisa só: CRON_SECRET não existe no
          # servidor — morte silenciosa do cron, não instabilidade. Vermelho.
          # 503 do edge (deploy em curso) não traz essa frase: fica em aviso, que
          # é o status transitório que este job de fato precisa tolerar.
          if [ "$code" = "503" ]; then
            if grep -qiE 'não configurado|not configured' /tmp/out.json; then
              echo "::error::A produção respondeu 503: CRON_SECRET não está configurado no servidor."
              exit 1
            fi
            echo "::warning::503 sem ser de configuração (provável deploy em curso). Não falhei o job."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::A rota respondeu HTTP $code — o worker de execução não rodou."
            exit 1
          fi
