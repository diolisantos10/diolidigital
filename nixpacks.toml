# ffmpeg no runtime do Railway.
#
# A dona do salão manda 3 vídeos por semana do celular. Até 02/08/2026 ninguém
# editava nada: a agência devolvia o ROTEIRO e o material bruto dela ficava
# parado no armazenamento. Editar exige ffmpeg, e ffmpeg não vem no build padrão
# do Node — sem esta linha, `lib/agency/media/video.ts` compila, sobe, e falha
# em produção com "command not found".
#
# `nixpacks.toml` não existia neste repositório. Ele NÃO substitui a detecção
# automática do Nixpacks: só acrescenta pacotes ao ambiente que ele já monta.
[phases.setup]
nixPkgs = ["...", "ffmpeg-headless"]
