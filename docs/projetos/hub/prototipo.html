<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub do Cliente — Protótipo navegável v1 · Dioli Digital</title>
<style>
/* ── Tokens HUMANTECH (espelho de app/globals.css — não inventar) ───────── */
:root{
  --navy:#070A1F; --cyan:#9AF5F0; --graphite:#1F2937;
  --cyan-bright:#2AE3F5; --azure:#1FB7E7; --electric:#0057FF;
  --bg:#F7F8FA; --bg-elevated:#FDFDFE; --card:#FFFFFF; --sidebar:#070A1F;
  --text-primary:#1F2937; --text-secondary:#55606E; --text-muted:#8B95A3; --text-subtle:#B8C0CA;
  --border:#E6E9EE; --border-strong:#D2D7DE;
  --accent:#EEF1F4; --accent-light:#E6FBFA;
  --success:#16A34A; --success-bg:#DCFCE7;
  --warning:#D97706; --warning-bg:#FEF3C7;
  --danger:#DC2626;  --danger-bg:#FEF2F2;
  --info:#2563EB;    --info-bg:#EFF6FF;
  --shadow-xs:0 1px 2px rgba(0,0,0,.06);
  --shadow-sm:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.09),0 0 0 1px rgba(0,0,0,.04);
  --font-display:"Sora","Inter",-apple-system,sans-serif;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"SF Mono","Fira Code","Roboto Mono",monospace;
  --ease-out:cubic-bezier(.16,1,.3,1); --duration:140ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.02em;line-height:1.25}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
*:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}

/* ── Barra do protótipo (seletor de visão) ─────────────────────────────── */
.proto-bar{background:var(--sidebar);color:#E8E8F0;font-size:12px;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.proto-bar .tag{color:var(--cyan);font-family:var(--font-mono);font-size:11px;letter-spacing:.04em}
.proto-bar .views{display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:8px;padding:3px}
.proto-bar .views button{border:0;background:transparent;color:#B9BECD;font-size:12px;padding:4px 10px;border-radius:6px;transition:all var(--duration) var(--ease-out)}
.proto-bar .views button.on{background:var(--cyan);color:var(--navy);font-weight:600}

/* ── Header do portal ───────────────────────────────────────────────────── */
.portal-head{background:var(--card);border-bottom:1px solid var(--border)}
.portal-head .inner{max-width:960px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--navy)}
.logo .mark{width:22px;height:22px;position:relative}
.logo .mark::before{content:"";position:absolute;inset:0;border:2.5px solid var(--navy);border-radius:50%}
.logo .mark::after{content:"";position:absolute;width:9px;height:9px;background:var(--navy);border-radius:50%;right:-1px;bottom:-1px}
.client-chip{margin-left:auto;font-size:12px;color:var(--text-secondary);background:var(--accent);border-radius:999px;padding:4px 12px;white-space:nowrap}

/* ── Navegação (6 itens) ───────────────────────────────────────────────── */
.portal-nav{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:37px;z-index:40}
.portal-nav .inner{max-width:960px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 8px}
.portal-nav .inner::-webkit-scrollbar{display:none}
.portal-nav a{flex:0 0 auto;text-decoration:none;font-size:13px;color:var(--text-secondary);padding:11px 12px;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:color var(--duration) var(--ease-out)}
.portal-nav a.on{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
.portal-nav a:hover{color:var(--text-primary)}
.nav-dot{display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:999px;background:var(--warning-bg);color:var(--warning);font-size:11px;font-weight:700;padding:0 4px}

/* ── Layout ─────────────────────────────────────────────────────────────── */
main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
.screen-title{font-size:22px;margin-bottom:2px}
.screen-sub{color:var(--text-secondary);font-size:13px;margin-bottom:20px}
section{margin-bottom:24px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-label .n{width:18px;height:18px;border-radius:6px;background:var(--navy);color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono)}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm)}
.card + .card{margin-top:10px}
.card .pad{padding:16px}
.surface{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px}

/* Badges de estado — cor nunca é o único sinal (texto sempre junto) */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-warn{background:var(--warning-bg);color:var(--warning)}
.b-ok{background:var(--success-bg);color:var(--success)}
.b-danger{background:var(--danger-bg);color:var(--danger)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-neutral{background:var(--accent);color:var(--text-secondary)}
.b-cyan{background:var(--accent-light);color:#0E7490}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;font-size:13px;font-weight:600;padding:10px 16px;border:1px solid transparent;transition:all var(--duration) var(--ease-out);text-decoration:none}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:#141838}
.btn-secondary{background:var(--card);color:var(--text-primary);border-color:var(--border-strong)}
.btn-secondary:hover{border-color:var(--text-muted);background:var(--bg-elevated)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}

/* Pendências */
.pend{display:flex;gap:12px;padding:14px 16px;align-items:flex-start;text-decoration:none;transition:background var(--duration) var(--ease-out)}
.pend:hover{background:var(--bg-elevated)}
.pend + .pend{border-top:1px solid var(--border)}
.pend .ico{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
.pend .tt{font-weight:600;font-size:13.5px}
.pend .why{color:var(--text-secondary);font-size:12.5px;margin-top:2px}
.pend .meta{color:var(--text-muted);font-size:11.5px;margin-top:4px}
.pend .go{margin-left:auto;align-self:center;color:var(--text-subtle);flex:0 0 auto}

/* Trilha de marcos */
.trilha{display:flex;flex-direction:column;gap:0;padding:16px}
.tstep{display:flex;gap:12px;position:relative;padding-bottom:18px}
.tstep:last-child{padding-bottom:0}
.tstep::before{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--border)}
.tstep:last-child::before{display:none}
.tstep .pt{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:10px;z-index:1}
.tstep.done .pt{background:var(--success);border-color:var(--success);color:#fff}
.tstep.now .pt{border-color:var(--navy);background:var(--navy);box-shadow:0 0 0 4px var(--accent-light)}
.tstep.now .pt::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.tstep .lb{font-size:13px;font-weight:600}
.tstep .dt{font-size:12px;color:var(--text-muted)}
.tstep.now .lb{color:var(--navy)}

/* Linhas de lista */
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;text-decoration:none}
.row + .row{border-top:1px solid var(--border)}
.row:hover{background:var(--bg-elevated)}
.row .grow{flex:1;min-width:0}
.row .tt{font-weight:600;font-size:13.5px}
.row .sub{color:var(--text-secondary);font-size:12px;margin-top:1px}
.thumb{flex:0 0 auto;width:40px;height:40px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:17px}

/* Placeholder de imagem (cinza) */
.img-ph{background:#E3E6EB;border:1px dashed var(--border-strong);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-muted);font-size:12px;aspect-ratio:4/5;max-height:340px;width:100%}
.img-ph .fr{font-size:26px;opacity:.5}
.img-ph.small{aspect-ratio:16/9;max-height:150px}

/* Métrica */
.metric{padding:16px}
.metric .name{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.metric .val{font-family:var(--font-display);font-size:30px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.metric .comp{font-size:12.5px}
.metric .goal{font-size:12.5px;color:var(--text-secondary);margin-top:2px}
.metric .action{margin-top:12px;background:var(--accent-light);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#0E7490;display:flex;gap:8px}
.metric .action b{color:#155E75}
.m-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.m-grid{grid-template-columns:1fr 1fr}}

/* Aprovação — detalhe */
.approve-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
@media(min-width:700px){.approve-actions{flex-direction:row}.approve-actions .btn{flex:1}}
textarea{width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;font:inherit;font-size:13px;resize:vertical;min-height:84px;background:var(--card);color:var(--text-primary)}
textarea:focus{outline:2px solid var(--navy);outline-offset:1px}
.form-help{font-size:12px;color:var(--text-muted);margin-top:6px}
.form-err{font-size:12px;color:var(--danger);margin-top:6px;font-weight:600}
.comment{display:flex;gap:10px;padding:12px 0}
.comment + .comment{border-top:1px solid var(--border)}
.comment .av{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--cyan);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.comment.you .av{background:var(--accent);color:var(--text-secondary)}
.comment .who{font-size:12px;font-weight:600}
.comment .when{font-size:11px;color:var(--text-muted);font-weight:400;margin-left:6px}
.comment .txt{font-size:13px;margin-top:2px;color:var(--text-primary)}
.pause-note{display:flex;gap:8px;align-items:flex-start;background:var(--info-bg);color:var(--info);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:12px}
.version-tag{font-family:var(--font-mono);font-size:11px;background:var(--accent);border-radius:6px;padding:2px 7px;color:var(--text-secondary)}
.v-old{border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:12px;background:var(--bg-elevated)}
.v-old .hd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-secondary)}

/* Conta / integrações */
.conn{padding:16px}
.conn .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.conn .plat{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--accent)}
.conn h3{font-size:14px}
.conn .who{font-size:12px;color:var(--text-muted)}
.conn dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;margin-top:12px}
.conn dt{color:var(--text-muted)}
.conn dd{color:var(--text-primary)}
.conn .foot{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}

/* Visões internas */
.int-head{background:var(--sidebar);color:#E8E8F0}
.int-head .inner{max-width:1100px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.int-head h1{font-size:17px;color:#fff}
.int-head .sub{font-size:12px;color:#9B9EB5}
main.wide{max-width:1100px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--border-strong);background:var(--card);border-radius:999px;font-size:12px;padding:5px 12px;color:var(--text-secondary)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
td .tt{font-weight:600}
td .sub{color:var(--text-muted);font-size:11.5px}
.dept-tag{font-size:11px;font-family:var(--font-mono);background:var(--accent);border-radius:6px;padding:2px 7px;color:var(--text-secondary);white-space:nowrap}

/* Área interna do mural */
.internal-zone{border:2px dashed var(--danger);border-radius:12px;background:#FFF7F7;margin-top:10px}
.internal-zone .iz-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px dashed var(--danger);color:var(--danger);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.internal-zone .iz-body{padding:14px 16px;display:grid;gap:12px}
.iz-item .lb{font-size:11px;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.06em}
.iz-item .tx{font-size:13px;margin-top:2px}

/* Toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:all .25s var(--ease-out);z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Rodapé */
.proto-foot{max-width:960px;margin:0 auto;padding:18px 16px 28px;color:var(--text-subtle);font-size:11.5px;text-align:center;border-top:1px solid var(--border)}
main.wide + .proto-foot{max-width:1100px}

.empty{padding:28px 16px;text-align:center;color:var(--text-secondary);font-size:13px}
.empty .ic{font-size:22px;margin-bottom:6px}
.link{color:var(--info);text-decoration:none;font-weight:600;font-size:12.5px}
.link:hover{text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary);text-decoration:none;margin-bottom:14px}
.back:hover{color:var(--text-primary)}
.hint-note{font-size:12px;color:var(--text-muted);background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-top:10px}
@keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fade-up 240ms var(--ease-out) both}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>

<div class="proto-bar">
  <span class="tag">PROTÓTIPO</span>
  <span style="opacity:.6">Visão:</span>
  <div class="views" role="tablist" aria-label="Alternar visão">
    <button id="vw-cliente" onclick="go('/inicio')">Cliente</button>
    <button id="vw-fila" onclick="go('/fila')">Fila interna</button>
    <button id="vw-mural" onclick="go('/mural')">Mural do cliente</button>
  </div>
</div>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════ ESTADO ═══════════════ */
const S = {
  // aprovações do cliente Foocci
  approvals: {
    ap1: {
      id:'ap1', titulo:'Carrossel 1 — "Chegou a Foocci"',
      tipo:'Carrossel de lançamento · 5 lâminas',
      status:'pending',            // pending | approved | revision_requested
      prazo:'06/08', expirada:false,
      impacto:'Enquanto este carrossel não é decidido, o agendamento do lançamento fica em espera.',
      versaoAtual:1,
      versoes:[{n:1, quando:'01/08', por:'Agente de Social (IA)', note:'Versão apresentada para aprovação',
        conteudo:'Lâmina 1: "Chegou a Foocci 🍔" · Lâmina 2: o cardápio de estreia · Lâmina 3: modo de pedir · Lâmina 4: horário e entrega · Lâmina 5: CTA "peça hoje e ganhe a sobremesa".'}],
      comentarios:[],
      duvidaAberta:false, prazoPausado:false,
    },
    ap2: {
      id:'ap2', titulo:'Copy do post de lançamento',
      tipo:'Legenda + hashtags · post único',
      status:'pending',
      prazo:'06/08', expirada:false,
      impacto:'Sem a legenda aprovada, o post de lançamento não entra na fila de publicação.',
      versaoAtual:1,
      versoes:[{n:1, quando:'02/08', por:'Agente de Social (IA)', note:'Versão apresentada para aprovação',
        conteudo:'"A espera acabou: a Foocci chegou. Sabor de verdade, do nosso balcão para a sua casa. 📍 Pedidos pelo link da bio." + 8 hashtags locais.'}],
      comentarios:[],
      duvidaAberta:false, prazoPausado:false,
    },
  },
  decisoes: [
    {resumo:'Preço R$ 2.050/mês — a faturar', detalhe:'Proposta comercial aceita pela Foocci', quem:'Foocci (cliente)', quando:'30/07', origem:'Aprovação da proposta'},
    {resumo:'Direção criativa aprovada', detalhe:'Rota visual "sabor de bairro" escolhida para o lançamento', quem:'Foocci (cliente)', quando:'28/07', origem:'Marco do projeto'},
  ],
  conexoes: {
    instagram:{status:'quebrada'}, // quebrada | ok
  },
  materialPendente:true,
};

const fmtHoje = 'hoje';

/* ═══════════════ HELPERS ═══════════════ */
const $ = s => document.querySelector(s);
function go(path){ location.hash = '#'+path; }
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3200);
}
function pendCount(){
  let n=0;
  for(const a of Object.values(S.approvals)) if(a.status==='pending') n++;
  if(S.materialPendente) n++;
  if(S.conexoes.instagram.status==='quebrada') n++;
  return n;
}
function apPendentes(){ return Object.values(S.approvals).filter(a=>a.status==='pending'); }
function statusBadge(a){
  if(a.status==='approved') return '<span class="badge b-ok">Aprovado</span>';
  if(a.status==='revision_requested') return '<span class="badge b-info">Ajustes solicitados</span>';
  if(a.duvidaAberta) return '<span class="badge b-cyan">Dúvida aberta — aguardando a agência</span>';
  return '<span class="badge b-warn">Aguardando sua decisão</span>';
}

/* ═══════════════ SHELL DO PORTAL (cliente) ═══════════════ */
const NAV = [
  ['/inicio','Início'],['/projetos','Projetos'],['/aprovacoes','Aprovações'],
  ['/resultados','Resultados'],['/arquivos','Arquivos'],['/conta','Conta'],
];
function shellCliente(route, content){
  const nAp = apPendentes().length;
  const nav = NAV.map(([p,l])=>{
    const on = route===p || route.startsWith(p+'/');
    const dot = (p==='/aprovacoes' && nAp>0) ? `<span class="nav-dot">${nAp}</span>` : '';
    return `<a href="#${p}" class="${on?'on':''}">${l}${dot}</a>`;
  }).join('');
  return `
  <header class="portal-head">
    <div class="inner">
      <span class="logo"><span class="mark" aria-hidden="true"></span>Dioli Digital</span>
      <span class="client-chip">Portal de <b>Foocci</b></span>
    </div>
  </header>
  <nav class="portal-nav" aria-label="Navegação do portal"><div class="inner">${nav}</div></nav>
  <main class="fade">${content}</main>
  ${rodape()}`;
}
function rodape(){
  return `<footer class="proto-foot">Protótipo navegável — Hub do Cliente v1 · nada aqui é produção</footer>`;
}

/* ═══════════════ TELA: INÍCIO ═══════════════ */
function telaInicio(){
  /* 1 · Pendências (bloco nº 1 da casa) */
  const pend=[];
  for(const a of apPendentes()){
    pend.push(`<a class="pend" href="#/aprovacoes/${a.id}">
      <span class="ico" style="background:var(--warning-bg)">✍️</span>

/* — ações do fluxo de aprovação — */
function aprovar(id){
  const a=S.approvals[id];
  a.status='approved';
  S.decisoes.unshift({resumo:`${a.titulo} — aprovado (v${a.versaoAtual})`, quem:'Foocci (cliente)', quando:fmtHoje, origem:'Aprovação'});
  toast('Aprovado ✓ — decisão registrada. A peça entrou na fila de publicação.');
  render();
}
function abrirForm(id, kind){
  const area=$('#form-area');
  const cfg = kind==='ajuste'
    ? {ph:'O que precisa mudar? Seja específico — a equipe refaz a partir disto.',
       help:'O comentário é obrigatório: é ele que orienta a nova versão. A versão atual fica preservada.',
       btn:'Enviar pedido de ajuste', fn:'enviarAjuste'}
    : {ph:'Qual é a sua dúvida sobre esta peça?',
       help:'A dúvida fica presa a este card e não muda sua decisão. O prazo pausa até a agência responder.',
       btn:'Enviar dúvida', fn:'enviarDuvida'};
  area.innerHTML = `
    <div style="margin-top:14px" class="fade">
      <label for="txt-${kind}" style="font-size:12.5px;font-weight:600;display:block;margin-bottom:6px">${kind==='ajuste'?'Descreva o ajuste':'Escreva sua dúvida'}</label>
      <textarea id="txt-${kind}" placeholder="${cfg.ph}" oninput="document.getElementById('send-btn').disabled = !this.value.trim()"></textarea>
      <p class="form-help">${cfg.help}</p>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button id="send-btn" class="btn btn-primary" disabled onclick="${cfg.fn}('${id}','txt-${kind}')">${cfg.btn}</button>
        <button class="btn btn-secondary" onclick="document.getElementById('form-area').innerHTML=''">Cancelar</button>
      </div>
    </div>`;
  document.getElementById('txt-'+kind).focus();
}
function enviarAjuste(id, txtId){
  const txt = document.getElementById(txtId).value.trim();
  if(!txt){ toast('O comentário é obrigatório para pedir ajustes.'); return; } // trava — espelho do 400 do backend
  const a=S.approvals[id];
  a.comentarios.push({who:'Você', when:fmtHoje, kind:'revision', txt});
  // v(N) preservada; refação produz v(N+1); nova rodada pending vinculada à N+1
  const n = a.versaoAtual+1;
  a.versoes.push({n, quando:fmtHoje, por:'Agente de Social (IA)', note:`nova rodada — refeita a partir do seu comentário`,
    conteudo:'(v'+n+') Conteúdo refeito em resposta ao seu pedido: "'+txt.slice(0,80)+(txt.length>80?'…':'')+'"'});
  a.versaoAtual = n;
  a.status='pending';
  a.duvidaAberta=false; a.prazoPausado=false; // resposta da agência chegou junto da refação — prazo despausa (T5b)
  a.comentarios.push({who:'Dioli Digital', when:fmtHoje, txt:'Refação concluída: a v'+n+' está pronta para sua decisão. A v'+(n-1)+' segue preservada no histórico.'});
  S.decisoes.unshift({resumo:`${a.titulo} — ajustes solicitados na v${n-1}`, quem:'Foocci (cliente)', quando:fmtHoje, origem:'Aprovação'});
  toast('Ajuste enviado — v'+(n-1)+' preservada, v'+n+' criada e aguardando sua decisão.');
  render();
}
function enviarDuvida(id, txtId){
  const txt = document.getElementById(txtId).value.trim();
  if(!txt){ toast('Escreva a dúvida antes de enviar.'); return; }
  const a=S.approvals[id];
  a.comentarios.push({who:'Você', when:fmtHoje, kind:'question', txt});
  a.duvidaAberta=true; a.prazoPausado=true;   // status continua pending — dúvida não é decisão
  toast('Dúvida enviada — presa a este card. O prazo pausou até a agência responder.');
  render();
}
function toggleV1(){
  const b=$('#v1-body'), t=$('#btn-v1');
  const open = b.style.display!=='none';
  b.style.display = open?'none':'block';
  t.textContent = open?'Ver':'Ocultar';
}

/* ═══════════════ ROUTER ═══════════════ */
function parseHash(){
  const h = (location.hash||'#/inicio').slice(1);
  return h==='' ? '/inicio' : h;
}
function render(){
  const route = parseHash();
  const app = $('#app');
  // seletor de visão
  const view = route.startsWith('/fila') ? 'fila' : route.startsWith('/mural') ? 'mural' : 'cliente';
  for(const v of ['cliente','fila','mural']) $('#vw-'+v).classList.toggle('on', v===view);

  if(view==='fila'){ app.innerHTML = telaFila(); window.scrollTo(0,0); return; }
  if(view==='mural'){ app.innerHTML = telaMural(); window.scrollTo(0,0); return; }

  let content;
  if(route==='/inicio') content = telaInicio();
  else if(route==='/projetos') content = telaProjetos();
  else if(route.startsWith('/projetos/')) content = telaProjetoDetalhe();
  else if(route==='/aprovacoes') content = telaAprovacoes();
  else if(route.startsWith('/aprovacoes/')) content = telaAprovacaoDetalhe(route.split('/')[2]);
  else if(route==='/resultados') content = telaResultados();
  else if(route==='/arquivos') content = telaArquivos();
  else if(route==='/conta') content = telaConta();
  else content = telaInicio();
  app.innerHTML = shellCliente(route, content);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
if(!location.hash) location.hash = '#/inicio';
render();
</script>
